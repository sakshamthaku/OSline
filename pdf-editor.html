<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Line PDF Editor BETA VERSION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f1711;
            --bg-panel: #132216;
            --bg-card: #1b3020;
            --border-green: #274d2f;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-green-glow: rgba(16, 185, 129, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }
        
        .header {
            background: var(--bg-panel);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-green);
            height: 60px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .header-left span.brand {
            color: var(--accent-green);
            letter-spacing: 0.5px;
        }
        
        .header-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header-center button {
            background: var(--bg-card);
            border: 1px solid var(--border-green);
            color: var(--text-main);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .header-center button:hover {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }
        
        .header-center input {
            width: 55px;
            background: var(--bg-card);
            border: 1px solid var(--border-green);
            color: var(--text-main);
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }
        
        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .btn-back, .btn-download {
            background: var(--bg-card);
            border: 1px solid var(--border-green);
            color: var(--text-main);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-back:hover, .btn-download:hover {
            border-color: var(--accent-green);
        }
        
        .btn-download {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #000;
            font-weight: 600;
        }
        
        .btn-download:hover {
            background: var(--accent-green-hover);
            transform: translateY(-1px);
        }
        
        .container {
            display: flex;
            height: calc(100vh - 60px);
            overflow: hidden;
            position: relative;
        }
        
        .sidebar-left {
            width: 280px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-green);
            overflow-y: auto;
            padding: 15px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        
        .sidebar-section {
            margin-bottom: 20px;
        }
        
        .sidebar-title {
            color: var(--accent-green);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .tool-btn {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-green);
            color: var(--text-main);
            padding: 10px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        
        .tool-btn:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--accent-green);
        }
        
        .tool-btn.active {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            font-weight: 600;
            box-shadow: 0 0 10px var(--accent-green-glow);
        }
        
        .tool-icon {
            font-size: 15px;
            min-width: 20px;
            text-align: center;
        }
        
        .text-options {
            background: var(--bg-card);
            border: 1px solid var(--border-green);
            border-radius: 6px;
            padding: 12px;
            margin-top: 8px;
        }
        
        .option-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .option-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .option-row input, .option-row select {
            flex: 1;
            background: var(--bg-panel);
            border: 1px solid var(--border-green);
            color: var(--text-main);
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }

        .option-row input[type="color"] {
            padding: 2px;
            height: 30px;
            cursor: pointer;
        }
        
        .format-btns {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        
        .format-btn {
            flex: 1;
            background: var(--bg-panel);
            border: 1px solid var(--border-green);
            color: var(--text-main);
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .format-btn.active {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            font-weight: bold;
        }
        
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            position: relative;
            overflow: hidden;
        }
        
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090e0a;
            overflow: auto;
            position: relative;
            padding: 30px;
        }
        
        .pdf-canvas {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background: white;
            max-width: 100%;
            border-radius: 4px;
            cursor: crosshair;
        }
        
        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }
        
        .sidebar-right {
            width: 150px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-green);
            overflow-y: auto;
            padding: 10px;
            flex-shrink: 0;
        }
        
        .pages-title {
            color: var(--accent-green);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .page-thumbnail {
            width: 100%;
            aspect-ratio: 0.7;
            background: var(--bg-card);
            border: 2px solid var(--border-green);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .page-thumbnail:hover {
            border-color: var(--accent-green);
        }
        
        .page-thumbnail.active {
            border-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green-glow);
        }
        
        .page-thumbnail canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .page-num {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 2px 5px;
            border-radius: 3px;
        }
        
        .add-page-btn {
            width: 100%;
            padding: 20px 10px;
            background: var(--bg-card);
            border: 2px dashed var(--border-green);
            color: var(--accent-green);
            cursor: pointer;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            margin-top: 10px;
            text-align: center;
        }
        
        .add-page-btn:hover {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.05);
        }
        
        .upload-placeholder {
            color: var(--text-main);
            text-align: center;
            background: var(--bg-panel);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-green);
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .upload-placeholder-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .upload-placeholder-text {
            font-size: 15px;
            margin-bottom: 20px;
            color: var(--text-muted);
        }
        
        #pdfUpload, #addPdfUpload {
            display: none;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-panel);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border-green);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
        }

        .status-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--accent-green);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 6px;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Modal / Overlay Dialogs */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
        }
        .modal-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-green);
            padding: 20px;
            border-radius: 8px;
            width: 320px;
            max-width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-green);
            margin-bottom: 12px;
        }
        .modal-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-green);
            color: var(--text-main);
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 15px;
            outline: none;
        }
        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal-btn {
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            border: 1px solid var(--border-green);
            background: var(--bg-card);
            color: var(--text-main);
        }
        .modal-btn.primary {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            font-weight: 600;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .sidebar-left, .sidebar-right {
                width: 100%;
                max-height: 120px;
                display: flex;
                gap: 10px;
                overflow-x: auto;
                overflow-y: hidden;
            }
            .sidebar-right {
                order: 3;
                max-height: 100px;
            }
            .main-area {
                order: 2;
                height: calc(100vh - 280px);
            }
            .sidebar-section {
                margin-bottom: 0;
                min-width: 200px;
            }
            .page-thumbnail {
                width: 60px;
                min-width: 60px;
                aspect-ratio: 0.7;
                margin-bottom: 0;
            }
            .header-center {
                display: none; /* Can be handled via compact view or hidden */
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span class="brand">OS Line</span>
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="color:#fff; font-size:15px; font-weight: 500;">PDF Editor Pro</span>
                <span style="background:var(--warning); color:#000; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold;">BETA</span>
            </div>
        </div>
        <div class="header-center" id="toolbar" style="display: none;">
            <button onclick="app.firstPage()" title="First page">⏮</button>
            <button onclick="app.prevPage()" title="Previous page">‹</button>
            <input type="number" id="pageInput" value="1" min="1" onchange="app.goToPage(this.value)">
            <span id="totalPages" style="min-width: 30px; font-size:13px;">/ 1</span>
            <button onclick="app.nextPage()" title="Next page">›</button>
            <button onclick="app.lastPage()" title="Last page">⏭</button>
            <button onclick="app.zoomOut()" title="Zoom out">−</button>
            <span id="zoomLevel" style="min-width: 45px; text-align: center; font-size:13px;">100%</span>
            <button onclick="app.zoomIn()" title="Zoom in">+</button>
        </div>
        <div class="header-right">
            <a href="index.html" class="btn-back">← Back</a>
            <button class="btn-download" id="downloadBtn" onclick="app.downloadPDF()" style="display: none;">⬇ Download PDF</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar-left">
            <div class="sidebar-section">
                <div class="sidebar-title">Tools</div>
                <button class="tool-btn" onclick="app.selectTool('text')">
                    <span class="tool-icon">T</span>
                    <span>Add Text</span>
                </button>
                <button class="tool-btn" onclick="app.selectTool('watermark')">
                    <span class="tool-icon">💧</span>
                    <span>Watermark</span>
                </button>
                <button class="tool-btn" onclick="app.selectTool('rotate')">
                    <span class="tool-icon">⟲</span>
                    <span>Rotate Page</span>
                </button>
                <button class="tool-btn" onclick="app.selectTool('delete')">
                    <span class="tool-icon">🗑</span>
                    <span>Delete Page</span>
                </button>
            </div>
            
            <div class="sidebar-section" id="textOptionsSection" style="display: none;">
                <div class="sidebar-title">Text Configuration</div>
                <div class="text-options">
                    <div class="option-label">Font Family</div>
                    <select id="fontFamily">
                        <option value="Helvetica">Helvetica</option>
                        <option value="Times">Times-Roman</option>
                        <option value="Courier">Courier</option>
                    </select>
                    
                    <div class="option-label" style="margin-top: 8px;">Size & Color</div>
                    <div class="option-row">
                        <input type="number" id="fontSize" value="16" min="8" max="72">
                        <input type="color" id="fontColor" value="#000000">
                    </div>
                    
                    <div class="option-label" style="margin-top: 4px;">Style</div>
                    <div class="format-btns">
                        <button class="format-btn" id="boldBtn" onclick="app.toggleFormat('bold')">B</button>
                        <button class="format-btn" id="italicBtn" onclick="app.toggleFormat('italic')">I</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="main-area">
            <div class="canvas-area" id="canvasArea">
                <div class="upload-placeholder">
                    <div class="upload-placeholder-icon">📄</div>
                    <div class="upload-placeholder-text">Professional OS Line PDF Productivity Tool</div>
                    <button class="btn-download" onclick="app.triggerUpload()" style="margin: 0 auto;">Choose PDF File</button>
                </div>
            </div>
        </div>
        
        <div class="sidebar-right" id="rightSidebar" style="display: none;">
            <div class="pages-title">Pages</div>
            <div id="thumbnailsContainer"></div>
            <button class="add-page-btn" onclick="app.triggerAddPdf()">+ Add PDF</button>
        </div>
    </div>
    
    <input type="file" id="pdfUpload" accept=".pdf" onchange="app.handleFileUpload(event)">
    <input type="file" id="addPdfUpload" accept=".pdf" onchange="app.handleAddPdfUpload(event)">
    
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        const PDFDocument = PDFLib.PDFDocument;
        const rgb = PDFLib.rgb;
        const degrees = PDFLib.degrees;
        
        const app = {
            pdf: null,
            pdfDoc: null,
            currentPage: 1,
            zoom: 1.2,
            selectedTool: null,
            pageRotations: {}, // pageIndex -> angle
            pageTexts: {},     // pageIndex -> array of text objects
            pageWatermarks: {},// pageIndex -> watermark string
            isBold: false,
            isItalic: false,
            
            triggerUpload() {
                document.getElementById('pdfUpload').click();
            },

            triggerAddPdf() {
                document.getElementById('addPdfUpload').click();
            },
            
            showStatus(text) {
                const existing = document.querySelector('.status-message');
                if (existing) existing.remove();

                const msg = document.createElement('div');
                msg.className = 'status-message';
                msg.innerHTML = `<span>⚡</span> <span>${text}</span>`;
                document.body.appendChild(msg);
                setTimeout(() => msg.remove(), 3500);
            },
            
            async handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file || file.type !== 'pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                    this.showStatus('Please select a valid PDF file.');
                    return;
                }
                
                try {
                    this.showStatus('Loading PDF document...');
                    const arrayBuffer = await file.arrayBuffer();
                    
                    this.pdfDoc = await PDFDocument.load(arrayBuffer);
                    this.pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    
                    this.currentPage = 1;
                    this.zoom = 1.2;
                    this.pageRotations = {};
                    this.pageTexts = {};
                    this.pageWatermarks = {};
                    
                    document.getElementById('toolbar').style.display = 'flex';
                    document.getElementById('downloadBtn').style.display = 'flex';
                    document.getElementById('rightSidebar').style.display = 'block';
                    
                    await this.renderPage();
                    await this.updateThumbnails();
                    
                    this.showStatus('PDF loaded successfully!');
                    event.target.value = '';
                } catch (error) {
                    console.error('Error loading PDF:', error);
                    this.showStatus('Error loading PDF file.');
                }
            },

            async handleAddPdfUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                try {
                    this.showStatus('Appending PDF pages...');
                    const arrayBuffer = await file.arrayBuffer();
                    const externalDoc = await PDFDocument.load(arrayBuffer);
                    const copiedPages = await this.pdfDoc.copyPages(externalDoc, externalDoc.getPageIndices());
                    copiedPages.forEach(page => this.pdfDoc.addPage(page));

                    // Reload pdfjs instance
                    const serialized = await this.pdfDoc.save();
                    this.pdf = await pdfjsLib.getDocument(serialized).promise;

                    await this.renderPage();
                    await this.updateThumbnails();
                    this.showStatus('PDF pages added successfully!');
                    event.target.value = '';
                } catch(err) {
                    console.error(err);
                    this.showStatus('Failed to append PDF.');
                }
            },
            
            async renderPage() {
                if (!this.pdf) return;
                
                try {
                    const page = await this.pdf.getPage(this.currentPage);
                    const rotation = (this.pageRotations[this.currentPage - 1] || 0);
                    const viewport = page.getViewport({ scale: this.zoom, rotation: rotation });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.className = 'pdf-canvas';
                    
                    await page.render({ canvasContext: context, viewport }).promise;
                    
                    const canvasArea = document.getElementById('canvasArea');
                    canvasArea.innerHTML = '';
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'canvas-wrapper';
                    wrapper.appendChild(canvas);

                    // Canvas click handler for tools
                    canvas.onclick = (e) => this.handleCanvasClick(e, canvas);
                    
                    wrapper.appendChild(canvas);
                    canvasArea.appendChild(wrapper);
                    
                    document.getElementById('pageInput').value = this.currentPage;
                    document.getElementById('totalPages').textContent = `/ ${this.pdf.numPages}`;
                    document.getElementById('zoomLevel').textContent = `${Math.round(this.zoom * 100)}%`;
                } catch (error) {
                    console.error('Error rendering page:', error);
                }
            },
            
            async updateThumbnails() {
                if (!this.pdf) return;
                
                const container = document.getElementById('thumbnailsContainer');
                container.innerHTML = '';
                
                for (let i = 1; i <= this.pdf.numPages; i++) {
                    try {
                        const page = await this.pdf.getPage(i);
                        const rotation = (this.pageRotations[i - 1] || 0);
                        const viewport = page.getViewport({ scale: 0.2, rotation: rotation });
                        
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        
                        await page.render({ canvasContext: context, viewport }).promise;
                        
                        const thumb = document.createElement('div');
                        thumb.className = 'page-thumbnail' + (i === this.currentPage ? ' active' : '');
                        thumb.onclick = () => {
                            this.currentPage = i;
                            this.renderPage();
                            this.updateThumbnails();
                        };
                        
                        thumb.appendChild(canvas);
                        thumb.innerHTML += `<div class="page-num">${i}</div>`;
                        container.appendChild(thumb);
                    } catch (error) {
                        console.error('Error rendering thumbnail:', error);
                    }
                }
            },
            
            selectTool(tool) {
                this.selectedTool = tool;
                document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
                event.target.closest('.tool-btn').classList.add('active');
                
                const textSection = document.getElementById('textOptionsSection');
                if (tool === 'text') {
                    textSection.style.display = 'block';
                    this.showStatus('Click anywhere on the PDF to add text.');
                } else {
                    textSection.style.display = 'none';
                }

                if (tool === 'watermark') {
                    this.promptWatermark();
                } else if (tool === 'rotate') {
                    this.promptRotate();
                } else if (tool === 'delete') {
                    this.deleteCurrentPage();
                }
            },

            toggleFormat(type) {
                if (type === 'bold') {
                    this.isBold = !this.isBold;
                    document.getElementById('boldBtn').classList.toggle('active', this.isBold);
                } else if (type === 'italic') {
                    this.isItalic = !this.isItalic;
                    document.getElementById('italicBtn').classList.toggle('active', this.isItalic);
                }
            },

            handleCanvasClick(e, canvas) {
                if (this.selectedTool !== 'text') return;

                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Open modal to get text content
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-box">
                        <div class="modal-title">Add Text to PDF</div>
                        <input type="text" id="modalTextInput" class="modal-input" placeholder="Enter text..." autofocus>
                        <div class="modal-btns">
                            <button class="modal-btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                            <button class="modal-btn primary" id="modalAddBtn">Add Text</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                document.getElementById('modalTextInput').onkeydown = (ev) => {
                    if (ev.key === 'Enter') document.getElementById('modalAddBtn').click();
                };

                document.getElementById('modalAddBtn').onclick = () => {
                    const textVal = document.getElementById('modalTextInput').value;
                    if (textVal) {
                        const fontFam = document.getElementById('fontFamily').value;
                        const sizeVal = parseInt(document.getElementById('fontSize').value) || 14;
                        const colorVal = document.getElementById('fontColor').value;

                        // Normalize coordinates relative to actual PDF point dimensions
                        const pageIndex = this.currentPage - 1;
                        if (!this.pageTexts[pageIndex]) this.pageTexts[pageIndex] = [];

                        // Convert client coordinate mapping (PDF.js rendered size vs actual PDF points)
                        const canvasDisplayWidth = canvas.width;
                        
                        this.pageTexts[pageIndex].push({
                            text: textVal,
                            xRatio: x / canvas.clientWidth,
                            yRatio: y / canvas.clientHeight,
                            font: fontFam,
                            size: sizeVal,
                            color: colorVal,
                            bold: this.isBold,
                            italic: this.isItalic
                        });

                        this.showStatus('Text added successfully!');
                        // Re-render to show visual feedback if desired, or let final PDF handle it.
                    }
                    modal.remove();
                };
            },

            promptWatermark() {
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-box">
                        <div class="modal-title">Add Watermark</div>
                        <input type="text" id="modalWatermarkInput" class="modal-input" placeholder="e.g. CONFIDENTIAL">
                        <div class="modal-btns">
                            <button class="modal-btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                            <button class="modal-btn primary" id="modalWatermarkBtn">Apply</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                document.getElementById('modalWatermarkBtn').onclick = () => {
                    const val = document.getElementById('modalWatermarkInput').value;
                    if (val) {
                        this.pageWatermarks[this.currentPage - 1] = val;
                        this.showStatus('Watermark applied to current page!');
                    }
                    modal.remove();
                };
            },

            promptRotate() {
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-box">
                        <div class="modal-title">Rotate Page (Degrees)</div>
                        <select id="modalRotateSelect" class="modal-input">
                            <option value="90">90° Clockwise</option>
                            <option value="180">180°</option>
                            <option value="270">270° Clockwise</option>
                        </select>
                        <div class="modal-btns">
                            <button class="modal-btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                            <button class="modal-btn primary" id="modalRotateBtn">Rotate</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                document.getElementById('modalRotateBtn').onclick = async () => {
                    const angle = parseInt(document.getElementById('modalRotateSelect').value);
                    const pageIndex = this.currentPage - 1;
                    const currentRot = this.pageRotations[pageIndex] || 0;
                    this.pageRotations[pageIndex] = (currentRot + angle) % 360;

                    await this.renderPage();
                    await this.updateThumbnails();
                    this.showStatus('Page rotated successfully!');
                    modal.remove();
                };
            },

            async deleteCurrentPage() {
                if (this.pdf.numPages <= 1) {
                    this.showStatus('Cannot delete the last remaining page.');
                    return;
                }

                if (confirm(`Are you sure you want to delete page ${this.currentPage}?`)) {
                    const pageIndex = this.currentPage - 1;
                    this.pdfDoc.removePage(pageIndex);

                    // Rebuild pdfjs doc
                    const serialized = await this.pdfDoc.save();
                    this.pdf = await pdfjsLib.getDocument(serialized).promise;

                    if (this.currentPage > this.pdf.numPages) {
                        this.currentPage = this.pdf.numPages;
                    }

                    await this.renderPage();
                    await this.updateThumbnails();
                    this.showStatus('Page deleted successfully!');
                }
            },
            
            firstPage() { if (this.currentPage > 1) { this.currentPage = 1; this.renderPage(); this.updateThumbnails(); } },
            prevPage() { if (this.currentPage > 1) { this.currentPage--; this.renderPage(); this.updateThumbnails(); } },
            nextPage() { if (this.currentPage < this.pdf.numPages) { this.currentPage++; this.renderPage(); this.updateThumbnails(); } },
            lastPage() { if (this.currentPage < this.pdf.numPages) { this.currentPage = this.pdf.numPages; this.renderPage(); this.updateThumbnails(); } },
            
            goToPage(val) {
                const p = parseInt(val);
                if (p >= 1 && p <= this.pdf.numPages) {
                    this.currentPage = p;
                    this.renderPage();
                    this.updateThumbnails();
                }
            },
            
            zoomIn() {
                if (this.zoom < 3.0) {
                    this.zoom += 0.2;
                    this.renderPage();
                }
            },
            
            zoomOut() {
                if (this.zoom > 0.5) {
                    this.zoom -= 0.2;
                    this.renderPage();
                }
            },
            
            hexToRgb(hex) {
                let bigint = parseInt(hex.replace('#', ''), 16);
                let r = (bigint >> 16) & 255;
                let g = (bigint >> 8) & 255;
                let b = bigint & 255;
                return rgb(r / 255, g / 255, b / 255);
            },

            async downloadPDF() {
                if (!this.pdfDoc) return;
                
                try {
                    this.showStatus('Preparing final PDF document...');
                    
                    // Apply rotations
                    const pages = this.pdfDoc.getPages();
                    for (let i = 0; i < pages.length; i++) {
                        if (this.pageRotations[i]) {
                            const currentAngle = pages[i].getRotation().angle;
                            pages[i].setRotation(degrees(currentAngle + this.pageRotations[i]));
                        }

                        // Apply watermarks
                        if (this.pageWatermarks[i]) {
                            const { width, height } = pages[i].getSize();
                            const font = await this.pdfDoc.embedStandardFonts('Helvetica-Bold');
                            pages[i].drawText(this.pageWatermarks[i], {
                                x: width / 4,
                                y: height / 2,
                                size: 50,
                                font: font,
                                color: rgb(0.85, 0.85, 0.85),
                                rotate: degrees(45),
                                opacity: 0.4
                            });
                        }

                        // Apply added text
                        if (this.pageTexts[i]) {
                            for (let t of this.pageTexts[i]) {
                                let fontRef = PDFLib.StandardFonts.Helvetica;
                                if (t.font === 'Times') fontRef = PDFLib.StandardFonts.TimesRoman;
                                if (t.font === 'Courier') fontRef = PDFLib.StandardFonts.Courier;
                                
                                const embeddedFont = await this.pdfDoc.embedStandardFonts(fontRef);
                                const { width, height } = pages[i].getSize();
                                
                                // Coordinates mapping from relative ratio to PDF points
                                const pdfX = t.xRatio * width;
                                const pdfY = height - (t.yRatio * height);

                                pages[i].drawText(t.text, {
                                    x: pdfX,
                                    y: pdfY,
                                    size: t.size,
                                    font: embeddedFont,
                                    color: this.hexToRgb(t.color)
                                });
                            }
                        }
                    }

                    const pdfBytes = await this.pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    
                    const now = new Date();
                    const dateStr = now.toISOString().slice(0,10).replace(/-/g,'');
                    const timeStr = now.toTimeString().slice(0,5).replace(/:/g,'');
                    link.download = `OSLine-edited-${dateStr}-${timeStr}.pdf`;
                    
                    link.click();
                    this.showStatus('PDF downloaded successfully!');
                } catch (error) {
                    console.error('Download error:', error);
                    this.showStatus('Error generating final PDF.');
                }
            }
        };
    </script>
</body>
